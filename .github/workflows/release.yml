name: Release

on:
  push:
    branches: [main]
  # Re-publish an existing tag when GitHub release succeeded but npm did not
  # (e.g. first run failed auth). Does not create a new GitHub release.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to publish (e.g. v0.1.0)'
        required: true
        type: string

# Publishing to npm cannot be undone or overwritten, so never let two runs race.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Accumulates merged commits into an open "chore(main): release X.Y.Z" PR.
  # Merging a normal PR does NOT publish; merging the release PR does.
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' ||
        (needs.release-please.result == 'success' && needs.release-please.outputs.released == 'true')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm Trusted Publisher / provenance (OIDC). No NPM_TOKEN.
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Publish the tag release-please just cut, or the one chosen manually.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm rebuild better-sqlite3

      # Re-verified against the tag. CI already checked the branch, but the
      # thing being published is what must be green.
      - run: pnpm -r test

      - name: Build dashboard and CLI bundle
        run: pnpm build

      - name: Confirm the tarball contains what it should
        run: |
          npm pack --ignore-scripts
          tar tzf nomnomtokens-*.tgz > files.txt
          for required in package/dist/index.js package/bin/cli.js package/web/server/index.mjs; do
            grep -qx "$required" files.txt || { echo "::error::missing $required"; exit 1; }
          done
          echo "tarball ok ($(wc -l < files.txt) files)"

      - name: Publish to npm
        # Auth via npm Trusted Publisher (OIDC + id-token). Do not set
        # NODE_AUTH_TOKEN — a missing/empty NPM_TOKEN writes a blank .npmrc
        # entry and fails with ENEEDAUTH, blocking OIDC.
        # --ignore-scripts because pnpm build already ran; without it prepack
        # rebuilds the whole dashboard a second time.
        run: npm publish --provenance --access public --ignore-scripts

      - name: Summarise
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          ver="${VERSION:-${TAG#v}}"
          {
            echo "### Published \`nomnomtokens@${ver}\`"
            echo ""
            echo "- npm: https://www.npmjs.com/package/nomnomtokens"
            echo "- try it: \`npx nomnomtokens@${ver}\`"
          } >> "$GITHUB_STEP_SUMMARY"
